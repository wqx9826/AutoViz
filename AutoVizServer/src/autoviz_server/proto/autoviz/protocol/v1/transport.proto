syntax = "proto2";

package autoviz.protocol.v1;

import "autoviz/protocol/v1/control.proto";
import "autoviz/protocol/v1/perception.proto";
import "autoviz/protocol/v1/planning.proto";
import "autoviz/protocol/v1/runtime.proto";
import "autoviz/protocol/v1/vehicle.proto";

enum ChannelId {
  CHANNEL_UNKNOWN = 0;
  CHANNEL_VEHICLE_STATE = 1;
  CHANNEL_CHASSIS_STATE = 2;
  CHANNEL_CONTROL_COMMAND = 3;
  CHANNEL_GLOBAL_TRAJECTORY = 4;
  CHANNEL_LOCAL_TRAJECTORY = 5;
  CHANNEL_REFERENCE_LINE = 6;
  CHANNEL_OBSTACLES = 7;
  CHANNEL_ACTION_STATE = 8;
  CHANNEL_TASK_STATE = 9;
  CHANNEL_RUNTIME_STATE = 10;
  CHANNEL_VEHICLE_PARAMETERS = 11;
}

message VisualizationSnapshot {
  optional uint64 sequence = 1;
  optional uint64 server_time_ns = 2;
  optional string session_id = 3;
  optional SourceInfo source = 4;
  optional VehicleState vehicle_state = 10;
  optional ChassisState chassis_state = 11;
  optional ControlCommand control_command = 12;
  optional Trajectory global_trajectory = 13;
  optional Trajectory local_trajectory = 14;
  optional ReferenceLine reference_line = 15;
  optional ObstacleSet obstacles = 16;
  optional ActionState action_state = 17;
  optional TaskState task_state = 18;
  optional RuntimeState runtime_state = 19;
  optional VehicleParameters vehicle_parameters = 20;
}

message ChannelUpdate {
  enum Operation {
    OPERATION_UPSERT = 0;
    OPERATION_CLEAR = 1;
  }

  optional uint64 sequence = 1;
  optional uint64 server_time_ns = 2;
  optional string session_id = 3;
  optional ChannelId channel = 4 [default = CHANNEL_UNKNOWN];
  optional Operation operation = 5 [default = OPERATION_UPSERT];
  oneof payload {
    VehicleState vehicle_state = 10;
    ChassisState chassis_state = 11;
    ControlCommand control_command = 12;
    Trajectory trajectory = 13;
    ReferenceLine reference_line = 14;
    ObstacleSet obstacles = 15;
    ActionState action_state = 16;
    TaskState task_state = 17;
    RuntimeState runtime_state = 18;
    VehicleParameters vehicle_parameters = 19;
  }
}

message ClientHello {
  optional string client_name = 1;
  optional string client_version = 2;
  optional uint32 protocol_major = 3 [default = 1];
  optional uint32 protocol_minor = 4 [default = 0];
}

message ServerHello {
  optional string server_name = 1;
  optional string server_version = 2;
  optional uint32 protocol_major = 3 [default = 1];
  optional uint32 protocol_minor = 4 [default = 0];
  optional string session_id = 5;
  optional SourceInfo source = 6;
  repeated ChannelId available_channel = 7;
}

message SubscribeRequest {
  repeated ChannelId channel = 1;
  optional bool request_full_snapshot = 2 [default = true];
}

message Heartbeat {
  optional uint64 sequence = 1;
  optional uint64 send_time_ns = 2;
  optional string session_id = 3;
}

message ProtocolError {
  optional uint32 code = 1;
  optional string message = 2;
  optional bool fatal = 3 [default = false];
}

message Envelope {
  oneof body {
    ClientHello client_hello = 1;
    ServerHello server_hello = 2;
    SubscribeRequest subscribe_request = 3;
    VisualizationSnapshot snapshot = 4;
    ChannelUpdate channel_update = 5;
    Heartbeat heartbeat = 6;
    ProtocolError error = 7;
  }
}
