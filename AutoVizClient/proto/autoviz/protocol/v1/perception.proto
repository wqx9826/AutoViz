syntax = "proto2";

package autoviz.protocol.v1;

import "autoviz/protocol/v1/common.proto";
import "autoviz/protocol/v1/planning.proto";

message Obstacle {
  enum Type {
    TYPE_UNKNOWN = 0;
    TYPE_VEHICLE = 1;
    TYPE_PEDESTRIAN = 2;
    TYPE_CYCLIST = 3;
    TYPE_CONE = 4;
    TYPE_OTHER = 100;
  }

  optional Header header = 1;
  optional string id = 2;
  optional Type type = 3 [default = TYPE_UNKNOWN];
  optional sint32 source_class = 4;
  optional string class_label = 5;
  optional string source = 6;
  optional Point3D center = 7;
  optional double heading_rad = 8;
  optional double length_m = 9;
  optional double width_m = 10;
  optional double height_m = 11;
  optional Polygon2D polygon = 12;
  optional bool is_static = 13;
  optional bool is_virtual = 14;
  optional double confidence = 15;
  repeated TrajectoryPoint predicted_point = 16;
  repeated DiagnosticMetric attribute = 17;
}

message ObstacleSet {
  optional Header header = 1;
  repeated Obstacle obstacle = 2;
}
