syntax = "proto2";

package autoviz;

// Server 可以提供的稳定 UI 能力。Client 只按能力决定模块是否可见，
// 不解析 ROS topic、消息类型或 Adapter 名称。
enum Capability {
  CAPABILITY_UNKNOWN = 0;
  CAPABILITY_COMMON_PLANNING_CONTROL = 1;
  CAPABILITY_VERTICAL_MOTION = 2;
  CAPABILITY_UNDERWATER_SYSTEM = 3;
  CAPABILITY_PLATFORM_DIAGNOSTICS = 4;
}

// 来源健康状态对应的数据种类。它不是网络订阅通道；v2 只发送完整快照。
enum DataKind {
  DATA_KIND_UNKNOWN = 0;
  DATA_KIND_VEHICLE_STATE = 1;
  DATA_KIND_CHASSIS_STATE = 2;
  DATA_KIND_CONTROL_COMMAND = 3;
  DATA_KIND_GLOBAL_TRAJECTORY = 4;
  DATA_KIND_LOCAL_TRAJECTORY = 5;
  DATA_KIND_REFERENCE_LINE = 6;
  DATA_KIND_OBSTACLES = 7;
  DATA_KIND_ACTION_STATE = 8;
  DATA_KIND_TASK_STATE = 9;
  DATA_KIND_RUNTIME_STATE = 10;
  DATA_KIND_VEHICLE_PARAMETERS = 11;
}

// v2 中所有时间戳均使用 Unix epoch 纳秒；持续时间使用秒。
message Header {
  optional uint64 source_time_ns = 1;
  optional uint64 server_receive_time_ns = 2;
  optional uint64 sequence = 3;
  optional string module_name = 4;
  optional string frame_id = 5;
}

message Point2D {
  optional double x_m = 1;
  optional double y_m = 2;
}

message Point3D {
  optional double x_m = 1;
  optional double y_m = 2;
  optional double z_m = 3;
}

message Vector3D {
  optional double x = 1;
  optional double y = 2;
  optional double z = 3;
}

message Polygon2D {
  repeated Point2D point = 1;
}

// 面向 UI 的稳定诊断键值。key 是协议约定，不得使用 ROS 字段全名。
message DiagnosticMetric {
  optional string key = 1;
  optional string display_name = 2;
  optional string unit = 3;
  oneof value {
    double double_value = 10;
    sint64 int_value = 11;
    bool bool_value = 12;
    string string_value = 13;
  }
}

message DiagnosticNode {
  enum Level {
    LEVEL_UNKNOWN = 0;
    LEVEL_OK = 1;
    LEVEL_WARN = 2;
    LEVEL_ERROR = 3;
    LEVEL_STALE = 4;
  }

  optional string id = 1;
  optional string display_name = 2;
  optional Level level = 3 [default = LEVEL_UNKNOWN];
  optional string message = 4;
  repeated DiagnosticMetric metric = 5;
  repeated DiagnosticNode child = 6;
}
