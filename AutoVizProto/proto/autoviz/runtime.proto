syntax = "proto2";

package autoviz;

import "autoviz/common.proto";

message TopicStatus {
  optional string name = 1;
  optional string type = 2;
  optional uint64 last_update_time_ns = 3;
  optional uint64 timeout_ns = 4;
  optional double frequency_hz = 5;
  optional uint64 message_count = 6;
  optional bool timed_out = 7;
  // 来源无关的数据种类。name/type 只用于显示 Adapter 诊断信息。
  optional DataKind data_kind = 8 [default = DATA_KIND_UNKNOWN];
}

message SourceInfo {
  optional string source_id = 1;
  // 通讯中间件类型，例如 ROS、DDS、Kafka 等。用于显示 Adapter 诊断信息。
  optional string communication_type = 2;
  // 通讯中间件版本号。
  optional string communication_version = 3;
  optional string description = 4;
  repeated Capability capability = 5;
}

message RuntimeState {
  optional Header header = 1;
  repeated TopicStatus topic = 2;
  optional DiagnosticNode diagnostics = 3;
}
