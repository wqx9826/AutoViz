syntax = "proto2";

package autoviz;

import "autoviz/common.proto";
import "autoviz/underwater.proto";

message VehicleState {
  optional Header header = 1;
  optional Point3D position = 2;
  optional double heading_rad = 3;
  optional double pitch_rad = 4;
  optional double roll_rad = 5;
  optional Vector3D linear_velocity_mps = 6;
  optional Vector3D linear_acceleration_mps2 = 7;
  optional double speed_mps = 8;
  optional double yaw_rate_radps = 9;
  optional double longitudinal_acceleration_mps2 = 10;
  optional UnderwaterState underwater = 11;
  optional sint64 localization_status = 12;
  optional sint64 localization_error = 13;
  optional uint64 gps_time = 14;
  optional double longitude_deg = 15;
  optional double latitude_deg = 16;
  optional sint64 start_time_s = 17;
  optional double gauss_x_m = 18;
  optional double gauss_y_m = 19;
  optional double gauss_z_m = 20;
  optional double origin_longitude_deg = 21;
  optional double origin_latitude_deg = 22;
  optional double origin_x_m = 23;
  optional double origin_y_m = 24;
  optional double origin_z_m = 25;
  optional double odom_heading_rad = 26;
  optional double angular_velocity_x_radps = 27;
  optional double angular_velocity_y_radps = 28;
  optional sint64 usbl_message_word_1 = 29;
  optional sint64 usbl_message_word_2 = 30;
  optional sint64 usbl_message_word_3 = 31;
  optional sint64 usbl_message_word_4 = 32;
}

message CrawlMotorState {
  optional bool valid = 1;
  optional double speed_rpm = 2;
  optional double torque_or_q_axis_current = 3;
  optional sint32 temperature_c = 4;
  optional double bus_voltage_v = 5;
  optional bool controller_ready = 6;
  optional bool output_enabled = 7;
  optional sint32 controller_u_temperature_c = 8;
  optional sint32 controller_v_temperature_c = 9;
  optional bool fault = 10;
  optional sint32 motor_fault_code = 11;
  optional sint32 actuator_fault_code = 12;
  optional bool command_enable = 13;
  optional bool command_speed_mode = 14;
  optional bool command_reverse = 15;
  optional double command_speed_rpm = 16;
  optional double command_torque_or_q_axis_current = 17;
}

message BatteryState {
  optional bool valid = 1;
  optional sint32 self_check_status = 2;
  optional sint32 heartbeat = 3;
  optional sint32 alarm_level = 4;
  optional sint32 current_status = 5;
  optional double pack_voltage_v = 6;
  optional double pack_current_a = 7;
  optional sint32 max_cell_voltage_index = 8;
  optional double max_cell_voltage_v = 9;
  optional sint32 min_cell_voltage_index = 10;
  optional double min_cell_voltage_v = 11;
  optional sint32 max_temperature_index = 12;
  optional sint32 max_temperature_c = 13;
  optional sint32 min_temperature_index = 14;
  optional sint32 min_temperature_c = 15;
  optional sint32 state_of_charge_percent = 16;
  repeated sint32 warning_code = 17;
}

message PowerChannelState {
  optional uint32 index = 1;
  optional sint32 status = 2;
}

message PlatformDiagnostics {
  optional sint32 crawl_heartbeat = 1;
  optional CrawlMotorState left_crawl_motor = 2;
  optional CrawlMotorState right_crawl_motor = 3;
  optional BatteryState battery = 4;
  optional bool dcdc_enabled = 5;
  optional double smart_power_input_voltage_v = 6;
  repeated PowerChannelState power_channel = 7;
}

// 当前 robot_ws 尾推驱动器的 CAN 遥测。id 使其不绑定固定推进器数量。
message TailThrusterMotorState {
  optional string id = 1;
  optional double bus_current_a = 2;
  optional sint32 controller_temperature_c = 3;
  optional double target_speed_rpm = 4;
  optional double actual_speed_rpm = 5;
}

message ChassisState {
  optional Header header = 1;
  optional double speed_mps = 2;
  // robot_ws 监控反馈原值；Adapter 不按挡位或车辆坐标系改写符号。
  optional double yaw_rate_radps = 3;
  optional sint32 gear = 4;
  optional double throttle_percent = 5;
  optional double brake_percent = 6;
  optional bool hand_brake = 7;
  optional double energy_percent = 8;
  optional PlatformDiagnostics platform = 9;
  optional UnderwaterChassisState underwater = 10;
  reserved 11 to 13;
  repeated TailThrusterMotorState tail_thruster_motor = 14;
  // robot_ws ChassisStates heading controller diagnostics. Values are the
  // CAN-scaled protocol values; custom_msgs does not declare an angle unit.
  optional double heading_kp = 15;
  optional double heading_target_value = 16;
  optional double heading_actual_value = 17;
  optional double heading_error = 18;
  optional double heading_output = 19;
}

message VehicleParameters {
  optional double length_m = 1;
  optional double width_m = 2;
  optional double wheel_base_m = 3;
}
