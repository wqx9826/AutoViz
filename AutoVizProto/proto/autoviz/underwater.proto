syntax = "proto2";

package autoviz;

// 水下能力是通用规划控制协议的可选扩展。字段名描述业务语义，
// 不对应某个 ROS 消息的字段路径。

enum WaterTankState {
  WATER_TANK_STATE_UNKNOWN = 0;
  WATER_TANK_STATE_IDLE = 1;
  WATER_TANK_STATE_FILLING = 2;
  WATER_TANK_STATE_DRAINING = 3;
  WATER_TANK_STATE_MANUAL_OVERRIDE = 4;
  WATER_TANK_STATE_FAULT = 5;
  WATER_TANK_STATE_FILL_DONE = 6;
  WATER_TANK_STATE_DRAIN_DONE = 7;
}

enum BuoyancyCommand {
  BUOYANCY_COMMAND_UNKNOWN = 0;
  BUOYANCY_COMMAND_STOP = 1;
  BUOYANCY_COMMAND_FILL = 2;
  BUOYANCY_COMMAND_DRAIN = 3;
}

message UnderwaterState {
  optional double odom_z_m = 1;
  optional double depth_m = 2;
  optional double height_above_bottom_m = 3;
  optional double vertical_velocity_mps = 4;
}

message UnderwaterCommand {
  optional bool water_actuator_enabled = 1;
  optional sint32 navigation_mode = 2;
  optional double target_depth_m = 3;
  optional double target_height_above_bottom_m = 4;
  optional sint32 left_thruster_command = 5;
  optional sint32 right_thruster_command = 6;
  optional BuoyancyCommand buoyancy_command = 7 [default = BUOYANCY_COMMAND_UNKNOWN];
  optional bool sonar_power_enabled = 8;
  optional bool emergency_ascent = 9;
}

message ThrusterState {
  optional string id = 1;
  optional sint32 fault_code = 2;
}

message UnderwaterChassisState {
  optional sint32 water_tank_level = 1;
  optional bool water_tank_level_is_raw = 2;
  optional WaterTankState water_tank_state = 3 [default = WATER_TANK_STATE_UNKNOWN];
  optional sint32 water_heartbeat = 4;
  repeated ThrusterState thruster = 5;
  optional bool emergency_ascent_active = 6;
}

message UnderwaterTaskState {
  // 当前采样值；true 只表示解除按钮处于高电平。
  optional bool release_emergency_ascent = 1;
}
